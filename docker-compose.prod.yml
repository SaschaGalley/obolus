services:
  api:
    container_name: obolus-api
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT:-3306}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      JWT_SECRET: ${JWT_SECRET}
      BOOKAMAT_USER: ${BOOKAMAT_USER:-}
      BOOKAMAT_API_KEY: ${BOOKAMAT_API_KEY:-}
      BOOKAMAT_STARTING_YEAR: ${BOOKAMAT_STARTING_YEAR:-2015}
      # Bookamat-Name des Zahlungskontos, das dem Geschäftskonto entspricht.
      # Leer = automatisch (das Konto, über das die meisten zugeordneten Buchungen liefen).
      BOOKAMAT_BANKACCOUNT: ${BOOKAMAT_BANKACCOUNT:-}
      # Monatsabgleich: Umsätze des Geschäftskontos aus Umsatz
      # (GET /integrations/obolus/transactions). Der Key muss dort OBOLUS_API_KEY sein.
      UMSATZ_API_URL: ${UMSATZ_API_URL:-}
      UMSATZ_API_KEY: ${UMSATZ_API_KEY:-}
    volumes:
      - api_uploads:/app/packages/api/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      # Container startet erst die Migrationen, dann Nest — großzügig bemessen
      start_period: 90s
    restart: unless-stopped

  web:
    container_name: obolus-web
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      args:
        VITE_API_URL: ${API_URL}
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  api_uploads:
